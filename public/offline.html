<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b10" />
  <title>TacticAI · Sin conexión</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080b10; color: #eaeef5; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .box { max-width: 460px; text-align: center; }
    .badge { display: inline-block; font: 700 12px/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #ffb020; background: rgba(255,176,32,.1); border: 1px solid rgba(255,176,32,.4); border-radius: 999px; padding: 8px 14px; }
    h1 { font-size: 34px; margin: 22px 0 10px; letter-spacing: .02em; }
    h1 b { color: #ff7a1a; }
    p { color: #8e9bb0; line-height: 1.6; margin: 0 0 22px; }
    button { font: 600 15px system-ui, sans-serif; color: #1a0d00; background: #ff7a1a; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <span class="badge">Modo campo · sin red</span>
      <h1>TACTIC<b>AI</b></h1>
      <p>Todavía no hay una copia de la aplicación en este dispositivo. Ábrela una vez con internet y quedará disponible aquí sin conexión, con tus pizarras guardadas.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </main>
</body>
</html>
